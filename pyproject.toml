[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veripy-hdl"
version = "0.1.0"
description = "Python HDL that simulates and generates Verilog from the same source"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Danny Gale"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
keywords = ["hdl", "verilog", "fpga", "simulation", "hardware"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/dannygale/veripy"
Repository = "https://github.com/dannygale/veripy"
Issues = "https://github.com/dannygale/veripy/issues"

[project.scripts]
veripy = "veripy.cli:main"
